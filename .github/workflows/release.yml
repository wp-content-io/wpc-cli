# Release pipeline: one run per `v*` tag.
#
#   build ──► github-release ──► storage  (all three gated jobs:
#   (+ attestation,         └──► docker    environment `release`)
#    artifact upload)
#
# Nothing public happens before a person approves. `build` only compiles,
# smoke-tests, attests and uploads a workflow artifact (private to the run).
# Every job that publishes — the GitHub Release, the storage objects, the
# Docker images — runs in the `release` environment, which has a required
# reviewer (Settings → Environments): nothing is published until a maintainer approves.
# A tag builds the release; someone decides when it goes out. Storage and
# Docker wait for the GitHub Release because the manifest pins its asset and
# the storage job verifies it byte for byte before announcing it.
#
# Which channels a tag may publish to. Every tag publishes its immutable,
# versioned objects (storage <version>/wpc.phar + .sha256, Docker :<version>
# and :<version>-php8.x, a GitHub Release — a *prerelease* for a pre-release
# tag). Only a stable tag (vX.Y.Z, nothing after it) that is also the newest
# stable tag may move the mutable ones: storage latest/ (phar, sum, manifest)
# and Docker :latest / :php8.x.
#
# Those are what `self-update`, the passive "new version" notice and every
# `image: …:latest` pipeline follow without asking. Letting a pre-release
# (v2.1.0-rc.1, v3.0.0-beta.1…) through would install a beta on every
# customer machine and CI that updates itself — the opposite of what a beta
# is for. A stable tag that is not the newest stable one (a 2.0.x patch cut
# after 2.1.0) publishes its versioned objects only too, so the floating
# channels never move backwards. `build` decides this once (`channel`,
# `floating`); every step that touches a floating channel checks it twice:
# an `if:` on the job outputs, and a shell assertion re-deriving it from the
# tag itself — see the storage and docker jobs.
#
# Every third-party action is pinned to a full commit SHA (a tag can be
# moved, a commit cannot), with its release in a trailing comment.
# Dependabot (github-actions ecosystem) bumps the SHA and the comment
# together.

name: Release

on:
  push:
    tags: ['v*']

# Never cancel a release half-way: storage objects go up in a set order.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default: every job asks for exactly what it needs.
permissions: {}

env:
  BOX_VERSION: "4.7.0"
  # Newest stable PHP: its image also serves the unqualified :<version> and
  # :latest tags.
  PHP_LATEST: "8.5"
  DOWNLOADS_BASE_URL: https://downloads.wp-content.io/wpc-cli
  DOCKERHUB_IMAGE: wpcontent/wpc-cli
  GHCR_IMAGE: ghcr.io/wp-content-io/wpc-cli

jobs:
  build:
    name: Build wpc.phar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write      # build provenance (Sigstore)
      attestations: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      floating: ${{ steps.meta.outputs.floating }}
    steps:
      # Full history *and* tags: Box's `git-tag` reads the tag, and the
      # channel step compares this tag with every other stable one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # tag      v2.1.0         (GitHub Release, asset URL)
      # version  2.1.0          (manifest, storage path, Docker tags)
      # channel  stable | prerelease
      # floating true when the floating channels (latest/, :latest, :php8.x)
      #          may move: a stable tag that is the newest stable tag.
      #
      # The single place these are decided. A pre-release is anything with a
      # `-` after X.Y.Z (v2.1.0-rc.1, v3.0.0-beta.1): channel=prerelease and
      # floating=false, unconditionally — no other input can turn it on.
      - name: Resolve version and channel
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          stable_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          release_re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
          # The same shape Update\Version and Updater::GITHUB_ASSET accept: a
          # tag they would turn down is refused here, before anything is built.
          if ! [[ "$TAG" =~ $release_re ]]; then
            echo "::error::$TAG is not a release tag (vX.Y.Z or vX.Y.Z-pre)"
            exit 1
          fi
          version="${TAG#v}"
          if [[ "$TAG" =~ $stable_re ]]; then
            channel=stable
            newest=$(git tag -l 'v*' | grep -E "$stable_re" | sort -V | tail -n1)
            floating=$([ "$newest" = "$TAG" ] && echo true || echo false)
          else
            channel=prerelease
            floating=false
          fi
          # Belt and braces: the invariants every later guard relies on.
          if [ "$floating" = "true" ] && { [ "$channel" != "stable" ] || [[ "$version" == *-* ]]; }; then
            echo "::error::internal: floating=true for non-stable $TAG"; exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "channel=$channel"
            echo "floating=$floating"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::$TAG → version $version, channel $channel, floating channels move: $floating"

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          extensions: zip
          coverage: none
          tools: composer:v2

      - run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - name: Install Box ${{ env.BOX_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/box" "https://github.com/box-project/box/releases/download/${BOX_VERSION}/box.phar"
          chmod +x "$RUNNER_TEMP/box"

      # No dev fallback here (see ci.yml): a release phar is stamped from its
      # tag or not built at all.
      - name: Compile
        run: |
          php -d phar.readonly=0 "$RUNNER_TEMP/box" compile --no-interaction
          chmod +x wpc.phar
          sha256sum wpc.phar | cut -d' ' -f1 > wpc.phar.sha256

      # Box writes the tag verbatim (`v2.1.0`); `--version` shows it without
      # the `v` (Update\Version::display()). Anything else means the phar was
      # stamped from another tag than the one being released.
      - name: Smoke test
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          php wpc.phar --version | tee version.txt
          # "wp-content.io CLI 2.1.0": the last word, exactly.
          [ "$(awk '{print $NF}' version.txt)" = "$VERSION" ] || { echo "::error::wpc.phar does not report ${VERSION}"; exit 1; }
          php wpc.phar > /dev/null
          php wpc.phar plugin list --help > /dev/null
          php wpc.phar list --raw > /dev/null
          php wpc.phar completion bash > /dev/null

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: wpc.phar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpc-phar
          path: |
            wpc.phar
            wpc.phar.sha256
          if-no-files-found: error

  # The first public step, so the first one behind the approval gate: the
  # Release (and its notes, assets and "Latest" badge) only appears once
  # someone has approved the `release` deployment.
  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write   # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wpc-phar

      # The notes are the CHANGELOG section of this version (`## [2.1.0]…`, up
      # to the next `## [`), or a pointer to the CHANGELOG when there is none.
      - name: Release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)." > notes.md
          fi
          {
            echo
            echo '---'
            echo 'Verify the download: `sha256sum -c <(echo "$(cat wpc.phar.sha256)  wpc.phar")`,'
            echo "or its build provenance: \`gh attestation verify wpc.phar --repo ${GITHUB_REPOSITORY}\`."
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          FLOATING: ${{ needs.build.outputs.floating }}
        run: |
          flags=()
          if [ "$CHANNEL" = "stable" ] && [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Only the newest stable release is GitHub's "Latest".
            [ "$FLOATING" = "true" ] && flags+=(--latest) || flags+=(--latest=false)
          else
            # Anything else is a prerelease, never "Latest" — whatever the
            # outputs say, the tag itself decides.
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" wpc.phar wpc.phar.sha256 \
            --title "$TAG" --notes-file notes.md --verify-tag "${flags[@]}"

  storage:
    name: Publish to the update channel
    needs: [build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    # Two approved releases never write latest/ at the same time.
    concurrency:
      group: storage-latest
      cancel-in-progress: false
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      CHANNEL: ${{ needs.build.outputs.channel }}
      FLOATING: ${{ needs.build.outputs.floating }}
      # AWS CLI against an S3-compatible endpoint.
      AWS_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.STORAGE_REGION }}
      AWS_ENDPOINT_URL: ${{ secrets.STORAGE_ENDPOINT }}
      BUCKET: ${{ secrets.STORAGE_BUCKET }}
      # AWS CLI >= 2.23 sends CRC checksum headers by default, which not every
      # S3-compatible store accepts: only send them when the API requires it.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wpc-phar

      # The manifest will pin the GitHub asset, so it has to be downloadable
      # *as published* — and be the same bytes — before anything announces it.
      - name: Verify the GitHub release asset
        id: asset
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/wpc.phar"
          curl -fsIL --retry 5 --retry-delay 5 --retry-all-errors "$url" > /dev/null
          remote=$(curl -fsSL --retry 5 --retry-delay 5 "$url" | sha256sum | cut -d' ' -f1)
          [ "$remote" = "$(cat wpc.phar.sha256)" ] || { echo "::error::$url does not match wpc.phar.sha256"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Versioned (immutable), whatever the channel. The prefix is the version
      # *without* the v, as for every release since 1.x.
      - name: Upload the versioned objects
        run: |
          # VERSION comes from a tag matched in build: never empty, never `latest`.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::bad version '$VERSION'"; exit 1; }
          prefix="s3://${BUCKET}/wpc-cli/${VERSION}"
          aws s3 cp wpc.phar "${prefix}/wpc.phar" --acl public-read \
            --content-type application/octet-stream --metadata "version=${VERSION}" --only-show-errors
          aws s3 cp wpc.phar.sha256 "${prefix}/wpc.phar.sha256" --acl public-read \
            --content-type text/plain --only-show-errors
          curl -fsIL "${DOWNLOADS_BASE_URL}/${VERSION}/wpc.phar" > /dev/null

      # Stable releases only from here on — see the channel rules at the top.
      # A pre-release (or an older stable line) stops at the versioned objects.
      #
      # Why two guards on every step below: latest/ is what every installed
      # wpc follows through `self-update`, with no one in the loop. One
      # mistake here (a renamed output, an `if:` comparing the wrong string,
      # a step copied without its condition) would ship a release candidate to
      # every customer. So each step is skipped by its `if:` on the job
      # outputs, *and* refuses in shell to run unless the tag itself is a
      # plain vX.Y.Z — re-derived from TAG, not from the outputs — and the
      # build said it is the newest stable one. A pre-release that ever
      # reaches one of these steps fails the job before uploading anything.
      #
      # Latest (mutable alias), kept for the clients that predate the GitHub
      # pin — 2.0.0 does not trust a github.com URL and falls back to this
      # pair — and as the fallback when the manifest cannot be read. Two
      # objects cannot be replaced atomically, so these two can briefly
      # describe different builds; the phar goes up *before* its sum because
      # that pairs the new binary with the old sum, which an old client reads
      # as "already up to date" rather than as "Checksum mismatch".
      #
      # Current clients do not read this pair at all when the manifest pins a
      # release: they download its `url` — the GitHub asset, verified above —
      # and check it against its `sha256`, both from one document. That is why
      # the manifest goes up last: whatever manifest a client reads, the object
      # it names exists and matches the sum next to it.
      #
      # `Cache-Control: no-cache` on every latest/ object: the Edge Services
      # in front of downloads.wp-content.io do not cache these responses, and
      # the header keeps any other cache from serving a stale latest/.
      - name: Move latest/ (phar, sum)
        if: needs.build.outputs.channel == 'stable' && needs.build.outputs.floating == 'true'
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$CHANNEL" != "stable" ] \
            || [ "$FLOATING" != "true" ] || [[ "$VERSION" == *-* ]]; then
            echo "::error::refusing to write latest/ for $TAG (channel=$CHANNEL, floating=$FLOATING)"
            exit 1
          fi
          latest="s3://${BUCKET}/wpc-cli/latest"
          aws s3 cp wpc.phar "${latest}/wpc.phar" --acl public-read \
            --content-type application/octet-stream --cache-control no-cache \
            --metadata "version=${VERSION}" --only-show-errors
          aws s3 cp wpc.phar.sha256 "${latest}/wpc.phar.sha256" --acl public-read \
            --content-type text/plain --cache-control no-cache --only-show-errors

      # Announced last: the manifest is what the passive notice and
      # self-update read, so nothing is advertised before it can be
      # downloaded. Same two guards as above.
      - name: Announce latest/manifest.json
        if: needs.build.outputs.channel == 'stable' && needs.build.outputs.floating == 'true'
        env:
          ASSET_URL: ${{ steps.asset.outputs.url }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$CHANNEL" != "stable" ] \
            || [ "$FLOATING" != "true" ] || [[ "$VERSION" == *-* ]]; then
            echo "::error::refusing to write latest/manifest.json for $TAG (channel=$CHANNEL, floating=$FLOATING)"
            exit 1
          fi
          jq -n --arg version "$VERSION" --arg sha "$(cat wpc.phar.sha256)" --arg url "$ASSET_URL" \
            '{name: "wpc", version: $version, sha256: $sha, url: $url}' > manifest.json
          cat manifest.json
          aws s3 cp manifest.json "s3://${BUCKET}/wpc-cli/latest/manifest.json" --acl public-read \
            --content-type application/json --cache-control no-cache --only-show-errors

      - name: Summary
        run: |
          {
            echo "### ${TAG} (${CHANNEL})"
            echo "- ${DOWNLOADS_BASE_URL}/${VERSION}/wpc.phar"
            if [ "$CHANNEL" = "stable" ] && [ "$FLOATING" = "true" ]; then
              echo "- latest/ moved to ${VERSION} (manifest pins the GitHub asset)"
            else
              echo "- latest/ left untouched"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker image (PHP ${{ matrix.php }})
    needs: [build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      packages: write   # ghcr.io
      id-token: write   # image provenance attestation
      attestations: write
      artifact-metadata: write  # storage record (push-to-registry), attest v4
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wpc-phar

      # Immutable, whatever the channel: :<version>-php8.x, and :<version> for
      # the newest stable PHP. Floating (:php8.x, and :latest for the newest
      # stable PHP): stable releases only, and only the newest stable one —
      # see the channel rules at the top.
      - name: Tags
        id: tags
        env:
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          FLOATING: ${{ needs.build.outputs.floating }}
          PHP: ${{ matrix.php }}
        run: |
          tags=()
          for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            tags+=("${image}:${VERSION}-php${PHP}")
            [ "$PHP" = "$PHP_LATEST" ] && tags+=("${image}:${VERSION}")
            if [ "$CHANNEL" = "stable" ] && [ "$FLOATING" = "true" ]; then
              tags+=("${image}:php${PHP}")
              [ "$PHP" = "$PHP_LATEST" ] && tags+=("${image}:latest")
            fi
          done
          # Same hard guarantee as storage's latest/: unless the tag itself is
          # a plain vX.Y.Z flagged newest-stable, no floating tag may appear.
          if ! { [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "$CHANNEL" = "stable" ] && [ "$FLOATING" = "true" ]; }; then
            if printf '%s\n' "${tags[@]}" | grep -Eq ':(latest|php[0-9.]+)$'; then
              echo "::error::refusing floating Docker tags for $TAG"; exit 1
            fi
          fi
          { echo 'list<<EOF'; printf '%s\n' "${tags[@]}"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          printf '%s\n' "${tags[@]}"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The Dockerfile copies ./wpc.phar: the phar built (and attested) once
      # in the build job, not a rebuild per image.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            APP_VERSION=${{ needs.build.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          push: true
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
